<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowy Rozdział</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f8; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #2c3e50; }
        ul { list-style: none; padding: 0; }
        li { padding: 12px; margin: 8px 0; background: #eef2f7; border-radius: 6px; }
        .completed { text-decoration: line-through; opacity: 0.5; }
        button { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 6px; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Plan Działania: Nowy Rozdział</h1>
        <p>Dotknij punktu, który dziś zrealizowałeś:</p>
        <ul id="taskList">
            <li onclick="this.classList.toggle('completed')">1. Spokój, opanowanie i praca nad sobą</li>
            <li onclick="this.classList.toggle('completed')">2. Spokojna rozmowa i obecność dla dzieci</li>
            <li onclick="this.classList.toggle('completed')">3. Codzienna nauka IT z telefonu</li>
            <li onclick="this.classList.toggle('completed')">4. Porządkowanie codziennych spraw i budżetu</li>
        </ul>
        <button onclick="document.querySelectorAll('#taskList li').forEach(el => el.classList.remove('completed'))">Wyczyść na nowy dzień</button>
    </div>
</body>
</html>
